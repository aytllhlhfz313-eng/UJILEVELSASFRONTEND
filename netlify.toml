[build]
  publish = "build/web"
  command = "bash netlify-build.sh"

[build.environment]
  FLUTTER_VERSION = "3.44.7"

# Router Flutter web memakai hash (#/), jadi tidak perlu rewrite SPA.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
